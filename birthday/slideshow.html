<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mildred - Birthday Memories</title>
  <link rel="stylesheet" href="gift.css" />
</head>
<body class="gallery-page">
  <main class="gallery-shell">
    <header class="gallery-header">
      <div>
        <div class="buddy-ribbon">Soft pink memories</div>
        <p class="eyebrow">Birthday memories</p>
        <h1>Beautiful moments.</h1>
      </div>
      <div class="hero-actions">
        <a class="secondary-action" href="birthday.html">Back to wish</a>
        <a class="secondary-action" href="login.html">Lock gift</a>
      </div>
    </header>

    <section class="memory-showcase" aria-label="Featured birthday memories">
      <div class="showcase-card">
        <div class="showcase-media" id="showcaseMedia"></div>
        <div class="showcase-footer">
          <div class="preview-strip" id="previewStrip"></div>
          <div class="showcase-meta">
            <p class="eyebrow">Memory reel</p>
            <p class="quiet-note" id="showcaseCounter">1 / 4</p>
          </div>
        </div>
      </div>
    </section>

    <section class="slideshow-frame" id="slideshow" aria-label="Birthday photo slideshow"></section>

    <nav class="gallery-controls" aria-label="Gallery controls">
      <button class="icon-action" id="prevBtn" type="button" aria-label="Previous image">&lsaquo;</button>
      <div class="dots" id="dots"></div>
      <div class="counter"><span id="current">1</span> / <span id="total">4</span></div>
      <button class="icon-action" id="nextBtn" type="button" aria-label="Next image">&rsaquo;</button>
      <button class="secondary-action" id="playBtn" type="button">Pause</button>
      <button class="secondary-action" id="musicBtn" type="button">Play song</button>
      <button class="secondary-action" id="blushBtn" type="button">Blush mode</button>
    </nav>
  </main>

  <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-label="Full size image preview">
    <button class="icon-action" id="modalClose" type="button" aria-label="Close preview">&times;</button>
    <img id="modalImage" src="" alt="Full size birthday memory" />
  </div>

  <script>
    const images = [
      {
        src: '5a55dbca-8e6f-4d59-baa0-27f23ec818ea.png',
        title: 'Soft pink laughter',
        text: 'A little burst of joy from the sweetest birthday glow.'
      },
      {
        src: '88a93317-14e3-4518-b95b-09d692230013.png',
        title: 'Golden glow moments',
        text: 'Warm lights and even warmer smiles in the middle of the celebration.'
      },
      {
        src: 'b59828e1-7b9f-4db1-bf59-c0cf12104089.png',
        title: 'Quiet little sparkles',
        text: 'The kind of memory that feels gentle, bright, and almost cinematic.'
      },
      {
        src: 'd8fa3106-8bd7-4e36-a8b4-a4d5d3a684eb.png',
        title: 'The heart of the day',
        text: 'The favorite frame, wrapped in softness and celebration.'
      },
      {
        src: 'photo2.png',
        title: 'Sweet little shine',
        text: 'A cherished moment that keeps glowing in the heart.'
      },
      {
        src: 'photo3.png',
        title: 'A gentle glow',
        text: 'A soft memory that feels calm, warm, and full of love.'
      },
      {
        src: 'photo4.png',
        title: 'Birthday magic',
        text: 'The kind of sparkle that makes the day feel unforgettable.'
      },
      {
        src: 'd8fa3106-8bd7-4e36-a8b4-a4d5d3a684eb.png',
        title: 'The favorite frame',
        text: 'A final memory to close the reel with love.'
      }
    ];

    const slideshow = document.getElementById('slideshow');
    const dots = document.getElementById('dots');
    const currentEl = document.getElementById('current');
    const totalEl = document.getElementById('total');
    const showcaseMedia = document.getElementById('showcaseMedia');
    const showcaseCounter = document.getElementById('showcaseCounter');
    const previewStrip = document.getElementById('previewStrip');
    const playBtn = document.getElementById('playBtn');
    const musicBtn = document.getElementById('musicBtn');
    const blushBtn = document.getElementById('blushBtn');
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    let current = 0;
    let playing = true;
    let timer = null;
    let audioContext = null;
    let musicTimer = null;
    let musicPlaying = false;
    let musicStep = 0;
    const melody = [
      392.0, 392.0, 440.0, 392.0, 523.25, 493.88,
      392.0, 392.0, 440.0, 392.0, 587.33, 523.25,
      392.0, 392.0, 783.99, 659.25, 523.25, 493.88, 440.0,
      698.46, 698.46, 659.25, 523.25, 587.33, 523.25
    ];
    const rhythm = [
      0.32, 0.22, 0.52, 0.52, 0.52, 0.9,
      0.32, 0.22, 0.52, 0.52, 0.52, 0.9,
      0.32, 0.22, 0.52, 0.52, 0.52, 0.52, 1,
      0.32, 0.22, 0.52, 0.52, 0.52, 1.1
    ];

    images.forEach((memory, index) => {
      const slide = document.createElement('button');
      slide.className = `slide${index === 0 ? ' active' : ''}`;
      slide.type = 'button';
      slide.setAttribute('aria-label', `Open memory ${index + 1}`);
      slide.innerHTML = `<img src="${memory.src}" alt="Birthday memory ${index + 1}" />`;
      slide.addEventListener('click', () => openModal(memory.src));
      slideshow.appendChild(slide);

      const dot = document.createElement('button');
      dot.className = `dot${index === 0 ? ' active' : ''}`;
      dot.type = 'button';
      dot.setAttribute('aria-label', `Show memory ${index + 1}`);
      dot.addEventListener('click', () => goTo(index));
      dots.appendChild(dot);

      const preview = document.createElement('button');
      preview.className = `preview-thumb${index === 0 ? ' active' : ''}`;
      preview.type = 'button';
      preview.setAttribute('aria-label', `Show ${memory.title}`);
      preview.innerHTML = `<img src="${memory.src}" alt="${memory.title}" />`;
      preview.addEventListener('click', () => goTo(index));
      previewStrip.appendChild(preview);
    });

    totalEl.textContent = images.length;

    function renderFeatured() {
      const memory = images[current];
      showcaseMedia.innerHTML = `<div class="showcase-overlay"><span class="showcase-tag">Featured memory</span><h2>${memory.title}</h2><p>${memory.text}</p></div><img src="${memory.src}" alt="${memory.title}" />`;
      showcaseCounter.textContent = `${current + 1} / ${images.length}`;
      document.querySelectorAll('.dot').forEach((dot, dotIndex) => {
        dot.classList.toggle('active', dotIndex === current);
      });
      document.querySelectorAll('.preview-thumb').forEach((thumb, thumbIndex) => {
        thumb.classList.toggle('active', thumbIndex === current);
      });
      currentEl.textContent = current + 1;
    }

    function goTo(index) {
      current = (index + images.length) % images.length;
      document.querySelectorAll('.slide').forEach((slide, slideIndex) => {
        slide.classList.toggle('active', slideIndex === current);
      });
      renderFeatured();
      restart();
    }

    function next() {
      goTo(current + 1);
    }

    function previous() {
      goTo(current - 1);
    }

    function restart() {
      clearInterval(timer);
      if (playing) timer = setInterval(next, 5200);
    }

    function openModal(src) {
      modalImage.src = src;
      modal.classList.add('show');
      clearInterval(timer);
    }

    function closeModal() {
      modal.classList.remove('show');
      modalImage.src = '';
      restart();
    }

    document.getElementById('nextBtn').addEventListener('click', next);
    document.getElementById('prevBtn').addEventListener('click', previous);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });

    playBtn.addEventListener('click', () => {
      playing = !playing;
      playBtn.textContent = playing ? 'Pause' : 'Play';
      restart();
    });

    function ensureAudio() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = AudioCtx ? new AudioCtx() : null;
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      return audioContext;
    }

    function playNote(frequency, duration) {
      const context = ensureAudio();
      if (!context) return;

      const start = context.currentTime;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = 'triangle';
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.045, start + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.04);
    }

    function scheduleNextNote() {
      if (!musicPlaying) return;
      const duration = rhythm[musicStep % rhythm.length];
      playNote(melody[musicStep % melody.length], duration);
      musicStep += 1;
      musicTimer = setTimeout(scheduleNextNote, duration * 1000 + 80);
    }

    function startMusic() {
      if (musicPlaying) return;
      musicPlaying = true;
      musicBtn.textContent = 'Stop song';
      ensureAudio();
      scheduleNextNote();
    }

    function stopMusic() {
      musicPlaying = false;
      musicBtn.textContent = 'Play song';
      clearTimeout(musicTimer);
    }

    musicBtn.addEventListener('click', () => {
      if (musicPlaying) stopMusic();
      else startMusic();
    });

    blushBtn.addEventListener('click', () => {
      document.body.classList.toggle('blush-mode');
      blushBtn.textContent = document.body.classList.contains('blush-mode') ? 'Soft mode' : 'Blush mode';
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') next();
      if (event.key === 'ArrowLeft') previous();
      if (event.key === 'Escape' && modal.classList.contains('show')) closeModal();
    });

    let startX = 0;
    slideshow.addEventListener('pointerdown', (event) => {
      startX = event.clientX;
    });
    slideshow.addEventListener('pointerup', (event) => {
      const delta = event.clientX - startX;
      if (Math.abs(delta) > 45) delta < 0 ? next() : previous();
    });

    restart();
  </script>
</body>
</html>
