<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mildred — Birthday Memories</title>
  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #130a2a;
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.70);
      --pink: #ff5fd7;
      --gold: #ffd46a;
      --sky: #5ad7ff;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background: radial-gradient(1000px 500px at 10% 10%, rgba(90, 215, 255, 0.2), transparent 50%),
        radial-gradient(900px 400px at 80% 20%, rgba(255, 95, 215, 0.18), transparent 55%),
        radial-gradient(700px 500px at 30% 90%, rgba(255, 212, 106, 0.14), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .container {
      width: min(1000px, 100%);
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 40px);
      background: linear-gradient(90deg, var(--pink), var(--sky), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.3px;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .slideshow-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.3);
      box-shadow: var(--shadow), 0 0 60px rgba(255, 95, 215, 0.15);
      touch-action: pan-y;
    }

    .slides {
      position: absolute;
      inset: 0;
      display: flex;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .slide.active {
      opacity: 1;
      z-index: 2;
    }

    .slide.prev {
      opacity: 0;
      z-index: 1;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .modal-overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 40;
    }
    .modal-overlay.show{
      display: flex;
    }
    .modal-content{
      max-width: 95vw;
      max-height: 95vh;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0,0,0,.5);
      background: rgba(0,0,0,.9);
      position: relative;
    }
    .modal-content img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .modal-close{
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    @keyframes slideIn {
      from {
        transform: scale(0.95);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 95, 215, 0.0), rgba(255, 95, 215, 0.08)),
        linear-gradient(225deg, rgba(90, 215, 255, 0.0), rgba(90, 215, 255, 0.08));
      pointer-events: none;
      z-index: 3;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 10;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 212, 106, 0.2), rgba(255, 95, 215, 0.2));
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: var(--text);
      font-size: 20px;
      display: grid;
      place-items: center;
      transition: all 0.2s ease;
    }

    button:hover {
      background: linear-gradient(135deg, rgba(255, 212, 106, 0.35), rgba(255, 95, 215, 0.35));
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.08);
    }

    button:active {
      transform: scale(0.96);
    }

    .dots {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .dot.active {
      background: var(--gold);
      width: 28px;
      border-radius: 6px;
      border-color: rgba(255, 212, 106, 0.5);
    }

    .dot:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    .counter {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      min-width: 60px;
      text-align: center;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 16px rgba(90, 215, 255, 0.35);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(110vh);
        opacity: 0;
      }
      15% {
        opacity: 0.95;
      }
      to {
        transform: translateY(-140vh);
        opacity: 0;
      }
    }

    .nav-link {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.88);
      text-decoration: none;
      font-weight: 720;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 768px) {
      .slideshow-wrap {
        aspect-ratio: 16 / 9;
      }

      .controls {
        gap: 16px;
      }

      button {
        width: 40px;
        height: 40px;
        font-size: 16px;
      }

      .dot {
        width: 8px;
        height: 8px;
      }

      .dot.active {
        width: 24px;
      }

      .counter {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide {
        transition: none;
      }

      .slide img {
        animation: none;
      }

      .particle {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="particles" aria-hidden="true"></div>

  <div class="container">
    <div class="header">
      <h1>✨ Birthday Memories ✨</h1>
      <p>Cherishing beautiful moments with Mildred</p>
    </div>

    <div class="slideshow-wrap">
      <div class="slides" id="slides"></div>
      <div class="overlay"></div>
      <div class="modal-overlay" id="imageModal" role="dialog" aria-modal="true" aria-label="Full size image preview">
        <div class="modal-content">
          <button class="modal-close" id="modalClose" aria-label="Close image preview">×</button>
          <img src="" alt="Full size preview" id="modalImage">
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn" aria-label="Previous image">❮</button>
      <div class="dots" id="dots"></div>
      <div class="counter">
        <span id="current">1</span> / <span id="total">0</span>
      </div>
      <button id="nextBtn" aria-label="Next image">❯</button>
    </div>

    <div style="text-align: center; display:flex; justify-content:center; gap:18px; flex-wrap:wrap;">
      <a href="./birthday.html" class="nav-link">← Back to Birthday Wishes</a>
      <a href="./login.html" class="nav-link">🏠 Login</a>
    </div>
  </div>

  <script>
    const images = [
      '5a55dbca-8e6f-4d59-baa0-27f23ec818ea.png',
      '88a93317-14e3-4518-b95b-09d692230013.png',
      'b59828e1-7b9f-4db1-bf59-c0cf12104089.png',
      'd8fa3106-8bd7-4e36-a8b4-a4d5d3a684eb.png'
    ];

    let currentIndex = 0;
    const slidesContainer = document.getElementById('slides');
    const dotsContainer = document.getElementById('dots');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentEl = document.getElementById('current');
    const totalEl = document.getElementById('total');

    // Initialize slides and dots
    images.forEach((img, idx) => {
      const slide = document.createElement('div');
      slide.className = 'slide' + (idx === 0 ? ' active' : '');
      slide.innerHTML = `<a href="${img}" target="_blank" rel="noopener"><img src="${img}" alt="Memory ${idx + 1}" loading="lazy" /></a>`;
      slidesContainer.appendChild(slide);

      const dot = document.createElement('div');
      dot.className = 'dot' + (idx === 0 ? ' active' : '');
      dot.setAttribute('data-index', idx);
      dot.addEventListener('click', () => goToSlide(idx));
      dotsContainer.appendChild(dot);
    });

    totalEl.textContent = images.length;

    function updateSlide(newIndex) {
      currentIndex = (newIndex + images.length) % images.length;

      document.querySelectorAll('.slide').forEach((slide, idx) => {
        slide.classList.remove('active', 'prev');
        if (idx === currentIndex) {
          slide.classList.add('active');
        } else if (idx === (currentIndex - 1 + images.length) % images.length) {
          slide.classList.add('prev');
        }
      });

      document.querySelectorAll('.dot').forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentIndex);
      });

      currentEl.textContent = currentIndex + 1;
    }

    function goToSlide(index) {
      updateSlide(index);
    }

    function nextSlide() {
      updateSlide(currentIndex + 1);
    }

    function prevSlide() {
      updateSlide(currentIndex - 1);
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let isSwiping = false;

    slidesContainer.addEventListener('pointerdown', (event) => {
      touchStartX = event.clientX;
      touchStartY = event.clientY;
      touchEndX = event.clientX;
      isSwiping = true;
    });

    slidesContainer.addEventListener('pointermove', (event) => {
      if (!isSwiping) return;
      touchEndX = event.clientX;
    });

    slidesContainer.addEventListener('pointerup', (event) => {
      if (!isSwiping) return;
      const dx = event.clientX - touchStartX;
      const dy = event.clientY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (absDx > 40 && absDx > absDy) {
        if (dx < 0) nextSlide();
        else prevSlide();
      }
      isSwiping = false;
    });

    slidesContainer.addEventListener('pointercancel', () => {
      isSwiping = false;
    });

    // Modal preview
    const modalOverlay = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const modalClose = document.getElementById('modalClose');

    function openImageModal(src, alt) {
      modalImage.src = src;
      modalImage.alt = alt;
      modalOverlay.classList.add('show');
    }

    function closeImageModal() {
      modalOverlay.classList.remove('show');
      modalImage.src = '';
    }

    document.querySelectorAll('.slide img').forEach((img) => {
      img.addEventListener('click', () => {
        openImageModal(img.src, img.alt);
      });
    });

    modalClose.addEventListener('click', closeImageModal);
    modalOverlay.addEventListener('click', (event) => {
      if (event.target === modalOverlay) closeImageModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeImageModal();
      if (event.key === 'ArrowLeft') prevSlide();
      if (event.key === 'ArrowRight') nextSlide();
    });

    // Keyboard navigation handled above for arrows and escape

    // Auto-advance every 6 seconds
    setInterval(nextSlide, 6000);

    // Spawn floating particles
    const particlesWrap = document.querySelector('.particles');
    const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (!prefersReduced) {
      const colors = [
        'rgba(90,215,255,.95)',
        'rgba(255,95,215,.95)',
        'rgba(255,212,106,.95)',
        'rgba(255,255,255,.90)'
      ];

      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const left = Math.random() * 100;
        const delay = Math.random() * 6;
        const duration = 6 + Math.random() * 10;
        const size = 4 + Math.random() * 4;
        const col = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = left + '%';
        p.style.animationDelay = delay + 's';
        p.style.animationDuration = duration + 's';
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.background = col;
        p.style.boxShadow = `0 0 18px ${col}`;
        particlesWrap.appendChild(p);
      }
    }
  </script>
</body>
</html>
