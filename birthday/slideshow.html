<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mildred - Birthday Memories</title>
  <link rel="stylesheet" href="gift.css" />
</head>
<body class="gallery-page">
  <main class="gallery-shell">
    <header class="gallery-header">
      <div>
        <p class="eyebrow">Birthday memories</p>
        <h1>Beautiful moments.</h1>
      </div>
      <div class="hero-actions">
        <a class="secondary-action" href="birthday.html">Back to wish</a>
        <a class="secondary-action" href="login.html">Lock gift</a>
      </div>
    </header>

    <section class="slideshow-frame" id="slideshow" aria-label="Birthday photo slideshow"></section>

    <nav class="gallery-controls" aria-label="Gallery controls">
      <button class="icon-action" id="prevBtn" type="button" aria-label="Previous image">&lsaquo;</button>
      <div class="dots" id="dots"></div>
      <div class="counter"><span id="current">1</span> / <span id="total">4</span></div>
      <button class="icon-action" id="nextBtn" type="button" aria-label="Next image">&rsaquo;</button>
      <button class="secondary-action" id="playBtn" type="button">Pause</button>
    </nav>
  </main>

  <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-label="Full size image preview">
    <button class="icon-action" id="modalClose" type="button" aria-label="Close preview">&times;</button>
    <img id="modalImage" src="" alt="Full size birthday memory" />
  </div>

  <script>
    const images = [
      '5a55dbca-8e6f-4d59-baa0-27f23ec818ea.png',
      '88a93317-14e3-4518-b95b-09d692230013.png',
      'b59828e1-7b9f-4db1-bf59-c0cf12104089.png',
      'd8fa3106-8bd7-4e36-a8b4-a4d5d3a684eb.png'
    ];

    const slideshow = document.getElementById('slideshow');
    const dots = document.getElementById('dots');
    const currentEl = document.getElementById('current');
    const totalEl = document.getElementById('total');
    const playBtn = document.getElementById('playBtn');
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    let current = 0;
    let playing = true;
    let timer = null;

    images.forEach((src, index) => {
      const slide = document.createElement('button');
      slide.className = `slide${index === 0 ? ' active' : ''}`;
      slide.type = 'button';
      slide.setAttribute('aria-label', `Open memory ${index + 1}`);
      slide.innerHTML = `<img src="${src}" alt="Birthday memory ${index + 1}" />`;
      slide.addEventListener('click', () => openModal(src));
      slideshow.appendChild(slide);

      const dot = document.createElement('button');
      dot.className = `dot${index === 0 ? ' active' : ''}`;
      dot.type = 'button';
      dot.setAttribute('aria-label', `Show memory ${index + 1}`);
      dot.addEventListener('click', () => goTo(index));
      dots.appendChild(dot);
    });

    totalEl.textContent = images.length;

    function goTo(index) {
      current = (index + images.length) % images.length;
      document.querySelectorAll('.slide').forEach((slide, slideIndex) => {
        slide.classList.toggle('active', slideIndex === current);
      });
      document.querySelectorAll('.dot').forEach((dot, dotIndex) => {
        dot.classList.toggle('active', dotIndex === current);
      });
      currentEl.textContent = current + 1;
      restart();
    }

    function next() {
      goTo(current + 1);
    }

    function previous() {
      goTo(current - 1);
    }

    function restart() {
      clearInterval(timer);
      if (playing) timer = setInterval(next, 5200);
    }

    function openModal(src) {
      modalImage.src = src;
      modal.classList.add('show');
      clearInterval(timer);
    }

    function closeModal() {
      modal.classList.remove('show');
      modalImage.src = '';
      restart();
    }

    document.getElementById('nextBtn').addEventListener('click', next);
    document.getElementById('prevBtn').addEventListener('click', previous);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });

    playBtn.addEventListener('click', () => {
      playing = !playing;
      playBtn.textContent = playing ? 'Pause' : 'Play';
      restart();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight') next();
      if (event.key === 'ArrowLeft') previous();
      if (event.key === 'Escape' && modal.classList.contains('show')) closeModal();
    });

    let startX = 0;
    slideshow.addEventListener('pointerdown', (event) => {
      startX = event.clientX;
    });
    slideshow.addEventListener('pointerup', (event) => {
      const delta = event.clientX - startX;
      if (Math.abs(delta) > 45) delta < 0 ? next() : previous();
    });

    restart();
  </script>
</body>
</html>
