<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=login.html" />
  <title>Redirecting...</title>
  <style>
    body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial;background:#0b1020;color:#fff;display:grid;place-items:center;height:100vh;text-align:center;padding:20px;}
    a{color:#5ad7ff;text-decoration:none;font-weight:700;}
  </style>
</head>
<body>
  <div>
    <h1>Redirecting to the birthday login...</h1>
    <p>If you are not redirected automatically, <a href="login.html">click here</a>.</p>
  </div>
</body>
</html>

    <p class="birthday-subtitle">Enjoy this slideshow of your special moments</p>
  </div>

  <!-- Image Slider -->
  <div class="slider-container">
    <div class="slides" id="slides">
      <div class="slide active">
        <img src="5a55dbca-8e6f-4d59-baa0-27f23ec818ea.png" data-large="5a55dbca-8e6f-4d59-baa0-27f23ec818ea.png" alt="Birthday photo 1">
      </div>
      <div class="slide">
        <img src="88a93317-14e3-4518-b95b-09d692230013.png" data-large="88a93317-14e3-4518-b95b-09d692230013.png" alt="Birthday photo 2">
      </div>
      <div class="slide">
        <img src="b59828e1-7b9f-4db1-bf59-c0cf12104089.png" data-large="b59828e1-7b9f-4db1-bf59-c0cf12104089.png" alt="Birthday photo 3">
      </div>
      <div class="slide">
        <img src="d8fa3106-8bd7-4e36-a8b4-a4d5d3a684eb.png" data-large="d8fa3106-8bd7-4e36-a8b4-a4d5d3a684eb.png" alt="Birthday photo 4">
      </div>
    </div>
    <div class="modal-overlay" id="imageModal" role="dialog" aria-modal="true" aria-label="Full size image preview">
      <div class="modal-content">
        <button class="modal-close" id="modalClose" aria-label="Close image preview">×</button>
        <img src="" alt="Full size preview" id="modalImage">
      </div>
    </div>

    <!-- Dots Navigation -->
    <div class="dots" id="dots"></div>

    <!-- Counter -->
    <div class="counter"><span id="current">1</span> / <span id="total">4</span></div>

    <!-- Controls -->
    <div class="controls">
      <button class="control-btn" id="prevBtn">❮</button>
      <button class="control-btn play-pause" id="playPauseBtn">⏸</button>
      <button class="control-btn" id="nextBtn">❯</button>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dots');
    const totalSlides = slides.length;
    let currentSlide = 0;
    let isPlaying = true;
    let autoPlayInterval;

    // Create dots
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('div');
      dot.className = `dot ${i === 0 ? 'active' : ''}`;
      dot.addEventListener('click', () => goToSlide(i));
      dotsContainer.appendChild(dot);
    }

    const dots = document.querySelectorAll('.dot');

    function updateSlide() {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentSlide);
      });
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
      });
      document.getElementById('current').textContent = currentSlide + 1;
      createConfetti();
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % totalSlides;
      updateSlide();
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
      updateSlide();
    }

    function goToSlide(index) {
      currentSlide = index;
      updateSlide();
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      document.getElementById('playPauseBtn').textContent = isPlaying ? '⏸' : '▶';
      
      if (isPlaying) {
        startAutoPlay();
      } else {
        clearInterval(autoPlayInterval);
      }
    }

    function startAutoPlay() {
      clearInterval(autoPlayInterval);
      autoPlayInterval = setInterval(nextSlide, 3500);
    }

    // Event listeners
    document.getElementById('nextBtn').addEventListener('click', () => {
      nextSlide();
      if (isPlaying) startAutoPlay();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      prevSlide();
      if (isPlaying) startAutoPlay();
    });

    document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);

    // Confetti effect
    function createConfetti() {
      const colors = ['#ff5fd7', '#ffd46a', '#5ad7ff'];
      const confettiPieces = 50;

      for (let i = 0; i < confettiPieces; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animation = `confetti-fall ${2 + Math.random() * 1}s ease-out forwards`;
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
      }
    }

    // Start auto-play
    startAutoPlay();

    const modalOverlay = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const modalClose = document.getElementById('modalClose');

    function openImageModal(src, alt) {
      modalImage.src = src;
      modalImage.alt = alt;
      modalOverlay.classList.add('show');
    }

    function closeImageModal() {
      modalOverlay.classList.remove('show');
      modalImage.src = '';
    }

    document.querySelectorAll('.slide img').forEach((img) => {
      img.addEventListener('click', () => {
        openImageModal(img.dataset.large || img.src, img.alt);
      });
    });

    modalClose.addEventListener('click', closeImageModal);
    modalOverlay.addEventListener('click', (event) => {
      if (event.target === modalOverlay) closeImageModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeImageModal();
    });

    // Start auto-play
    startAutoPlay();

    // Trigger initial confetti
    createConfetti();
  </script>
</body>
</html>
