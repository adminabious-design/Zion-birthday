<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎉 Mildred's Birthday Animation 🎉</title>
  <style>
    :root{
      --bg1:#0b1020;--bg2:#130a2a;--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.70);
      --pink:#ff5fd7;--gold:#ffd46a;--sky:#5ad7ff;--shadow:0 20px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--text);
      background:
        radial-gradient(1000px 500px at 10% 10%, rgba(90,215,255,.20), transparent 50%),
        radial-gradient(900px 400px at 80% 20%, rgba(255,95,215,.18), transparent 55%),
        radial-gradient(700px 500px at 30% 90%, rgba(255,212,106,.14), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }

    /* Confetti */
    .confetti{position:fixed;width:10px;height:10px;pointer-events:none}
    @keyframes confetti-fall{
      to{transform:translateY(100vh) rotate(360deg);opacity:0}
    }

    /* Birthday Title */
    .birthday-title{
      text-align:center;
      margin-bottom:30px;
      z-index:10;
      animation:pulse-glow 2s ease-in-out infinite;
    }
    .birthday-title h1{
      font-size:clamp(32px,8vw,56px);
      margin:0;
      background:linear-gradient(90deg, var(--pink), var(--gold), var(--sky), var(--pink));
      background-size:200% auto;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      animation:gradient-shift 3s ease infinite;
      letter-spacing:2px;
    }
    .birthday-subtitle{
      font-size:18px;
      color:var(--muted);
      margin-top:10px;
    }

    @keyframes gradient-shift{
      0%{background-position:0% center}
      50%{background-position:100% center}
      100%{background-position:0% center}
    }

    @keyframes pulse-glow{
      0%,100%{transform:scale(1);opacity:1}
      50%{transform:scale(1.05);opacity:0.8}
    }

    /* Slider Container */
    .slider-container{
      position:relative;
      width:min(800px, 95vw);
      height:min(600px, 70vh);
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(255,95,215,.3);
      border:2px solid rgba(255,255,255,.1);
      background:rgba(0,0,0,.5);
    }

    .slides{
      position:relative;
      width:100%;
      height:100%;
    }

    .slide{
      position:absolute;
      inset:0;
      opacity:0;
      transition:opacity .8s ease-in-out;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.7);
    }

    .slide.active{opacity:1}

    .slide img{
      width:100%;
      height:100%;
      object-fit:cover;
      animation:zoom-in .8s ease-out;
      cursor: pointer;
    }
    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.85);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:30;
    }
    .modal-overlay.show{
      display:flex;
    }
    .modal-content{
      max-width:95vw;
      max-height:95vh;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 0 60px rgba(0,0,0,.5);
      background:rgba(0,0,0,.9);
      position:relative;
    }
    .modal-content img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }
    .modal-close{
      position:absolute;
      top:10px;
      right:10px;
      width:40px;
      height:40px;
      border-radius:50%;
      border:none;
      background:rgba(255,255,255,.12);
      color:#fff;
      font-size:22px;
      cursor:pointer;
      display:grid;
      place-items:center;
    }

    @keyframes zoom-in{
      from{transform:scale(.95);opacity:0}
      to{transform:scale(1);opacity:1}
    }

    /* Controls */
    .controls{
      position:absolute;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      display:flex;
      gap:15px;
      z-index:20;
      align-items:center;
    }

    .control-btn{
      appearance:none;
      border:none;
      width:45px;
      height:45px;
      border-radius:50%;
      background:rgba(255,255,255,.15);
      border:2px solid rgba(255,255,255,.3);
      color:white;
      font-size:20px;
      cursor:pointer;
      transition:all .3s ease;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .control-btn:hover{
      background:var(--pink);
      border-color:var(--pink);
      transform:scale(1.1);
      box-shadow:0 0 20px rgba(255,95,215,.5);
    }

    .control-btn:active{transform:scale(.95)}

    .play-pause{
      width:50px;
      height:50px;
      background:linear-gradient(135deg, var(--pink), var(--gold));
      border:none;
      box-shadow:0 0 30px rgba(255,95,215,.4);
    }

    /* Dots Indicator */
    .dots{
      position:absolute;
      top:20px;
      right:20px;
      display:flex;
      gap:8px;
      z-index:20;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:rgba(255,255,255,.3);
      cursor:pointer;
      transition:all .3s ease;
      border:2px solid transparent;
    }

    .dot.active{
      background:var(--pink);
      box-shadow:0 0 10px rgba(255,95,215,.6);
      width:30px;
      border-radius:6px;
    }

    .dot:hover{
      background:var(--sky);
    }

    /* Image Counter */
    .counter{
      position:absolute;
      bottom:20px;
      right:20px;
      background:rgba(0,0,0,.6);
      padding:8px 14px;
      border-radius:20px;
      font-size:14px;
      border:1px solid rgba(255,255,255,.2);
      z-index:20;
    }

    @media (max-width:600px){
      .slider-container{height:400px}
      .controls{bottom:15px;gap:10px}
      .control-btn{width:40px;height:40px;font-size:18px}
      .play-pause{width:45px;height:45px}
    }
  </style>
</head>
<body>
  <!-- Birthday Title -->
  <div class="birthday-title">
    <h1>🎉 Happy Birthday, Mildred! 🎉</h1>
    <p class="birthday-subtitle">Enjoy this slideshow of your special moments</p>
  </div>

  <!-- Image Slider -->
  <div class="slider-container">
    <div class="slides" id="slides">
      <div class="slide active">
        <img src="5a55dbca-8e6f-4d59-baa0-27f23ec818ea.png" data-large="5a55dbca-8e6f-4d59-baa0-27f23ec818ea.png" alt="Birthday photo 1">
      </div>
      <div class="slide">
        <img src="88a93317-14e3-4518-b95b-09d692230013.png" data-large="88a93317-14e3-4518-b95b-09d692230013.png" alt="Birthday photo 2">
      </div>
      <div class="slide">
        <img src="b59828e1-7b9f-4db1-bf59-c0cf12104089.png" data-large="b59828e1-7b9f-4db1-bf59-c0cf12104089.png" alt="Birthday photo 3">
      </div>
      <div class="slide">
        <img src="d8fa3106-8bd7-4e36-a8b4-a4d5d3a684eb.png" data-large="d8fa3106-8bd7-4e36-a8b4-a4d5d3a684eb.png" alt="Birthday photo 4">
      </div>
    </div>
    <div class="modal-overlay" id="imageModal" role="dialog" aria-modal="true" aria-label="Full size image preview">
      <div class="modal-content">
        <button class="modal-close" id="modalClose" aria-label="Close image preview">×</button>
        <img src="" alt="Full size preview" id="modalImage">
      </div>
    </div>

    <!-- Dots Navigation -->
    <div class="dots" id="dots"></div>

    <!-- Counter -->
    <div class="counter"><span id="current">1</span> / <span id="total">4</span></div>

    <!-- Controls -->
    <div class="controls">
      <button class="control-btn" id="prevBtn">❮</button>
      <button class="control-btn play-pause" id="playPauseBtn">⏸</button>
      <button class="control-btn" id="nextBtn">❯</button>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const dotsContainer = document.getElementById('dots');
    const totalSlides = slides.length;
    let currentSlide = 0;
    let isPlaying = true;
    let autoPlayInterval;

    // Create dots
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('div');
      dot.className = `dot ${i === 0 ? 'active' : ''}`;
      dot.addEventListener('click', () => goToSlide(i));
      dotsContainer.appendChild(dot);
    }

    const dots = document.querySelectorAll('.dot');

    function updateSlide() {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentSlide);
      });
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
      });
      document.getElementById('current').textContent = currentSlide + 1;
      createConfetti();
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % totalSlides;
      updateSlide();
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
      updateSlide();
    }

    function goToSlide(index) {
      currentSlide = index;
      updateSlide();
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      document.getElementById('playPauseBtn').textContent = isPlaying ? '⏸' : '▶';
      
      if (isPlaying) {
        startAutoPlay();
      } else {
        clearInterval(autoPlayInterval);
      }
    }

    function startAutoPlay() {
      clearInterval(autoPlayInterval);
      autoPlayInterval = setInterval(nextSlide, 3500);
    }

    // Event listeners
    document.getElementById('nextBtn').addEventListener('click', () => {
      nextSlide();
      if (isPlaying) startAutoPlay();
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      prevSlide();
      if (isPlaying) startAutoPlay();
    });

    document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);

    // Confetti effect
    function createConfetti() {
      const colors = ['#ff5fd7', '#ffd46a', '#5ad7ff'];
      const confettiPieces = 50;

      for (let i = 0; i < confettiPieces; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animation = `confetti-fall ${2 + Math.random() * 1}s ease-out forwards`;
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
      }
    }

    // Start auto-play
    startAutoPlay();

    const modalOverlay = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const modalClose = document.getElementById('modalClose');

    function openImageModal(src, alt) {
      modalImage.src = src;
      modalImage.alt = alt;
      modalOverlay.classList.add('show');
    }

    function closeImageModal() {
      modalOverlay.classList.remove('show');
      modalImage.src = '';
    }

    document.querySelectorAll('.slide img').forEach((img) => {
      img.addEventListener('click', () => {
        openImageModal(img.dataset.large || img.src, img.alt);
      });
    });

    modalClose.addEventListener('click', closeImageModal);
    modalOverlay.addEventListener('click', (event) => {
      if (event.target === modalOverlay) closeImageModal();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeImageModal();
    });

    // Start auto-play
    startAutoPlay();

    // Trigger initial confetti
    createConfetti();
  </script>
</body>
</html>
