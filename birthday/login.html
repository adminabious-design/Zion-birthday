<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mildred - Birthday Unlock</title>
  <link rel="stylesheet" href="gift.css" />
</head>
<body class="login-page">
  <main class="gate-shell">
    <section class="gate-media" aria-label="Birthday memories preview">
      <img src="5a55dbca-8e6f-4d59-baa0-27f23ec818ea.png" alt="Mildred birthday memory" />
      <img src="88a93317-14e3-4518-b95b-09d692230013.png" alt="Mildred birthday memory" />
      <img src="b59828e1-7b9f-4db1-bf59-c0cf12104089.png" alt="Mildred birthday memory" />
    </section>

    <section class="gate-panel">
      <p class="eyebrow">A little birthday gift</p>
      <h1>For Mildred</h1>
      <p class="lead">Enter her birthday to open the surprise made just for her.</p>

      <form id="loginForm" class="unlock-form" autocomplete="off">
        <div class="date-grid">
          <label>
            <span>Month</span>
            <input id="month" name="month" inputmode="numeric" maxlength="2" placeholder="MM" required />
          </label>
          <label>
            <span>Day</span>
            <input id="day" name="day" inputmode="numeric" maxlength="2" placeholder="DD" required />
          </label>
        </div>
        <button class="primary-action" type="submit">Unlock surprise</button>
        <p id="birthdayHint" class="quiet-note">Hint: July 7</p>
      </form>
    </section>
  </main>

  <script src="env-config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const monthEl = document.getElementById('month');
    const dayEl = document.getElementById('day');
    const hint = document.getElementById('birthdayHint');
    const appConfig = window.APP_CONFIG || {};
    const birthday = appConfig.BIRTHDAY_DATE || '07/07';
    const [defaultMonth, defaultDay] = birthday.split('/').map((value) => value.padStart(2, '0'));
    const birthdayName = new Date(2020, Number(defaultMonth) - 1, Number(defaultDay)).toLocaleDateString(undefined, {
      month: 'long',
      day: 'numeric'
    });

    hint.textContent = `Hint: ${birthdayName}`;

    function normalize(value) {
      return String(value).replace(/\D/g, '').padStart(2, '0').slice(-2);
    }

    [monthEl, dayEl].forEach((input) => {
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 2);
      });
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const mm = normalize(monthEl.value);
      const dd = normalize(dayEl.value);
      const month = Number(mm);
      const day = Number(dd);

      if (!Number.isFinite(month) || !Number.isFinite(day) || month < 1 || month > 12 || day < 1 || day > 31) {
        hint.textContent = 'Please enter a real date.';
        hint.classList.add('error');
        return;
      }

      window.location.href = `birthday.html?mm=${month}&dd=${day}`;
    });
  </script>
</body>
</html>
